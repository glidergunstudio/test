<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: linear-gradient(160deg, #fffaf0 0%, #ffe9e0 100%);
        padding: 16px;
      }

      .card {
        width: min(92vw, 420px);
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        padding: 24px 20px;
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        color: #333;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
        background: #1e88ff;
        cursor: pointer;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #1e88ff;
        outline-offset: 3px;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .result {
        margin-top: 18px;
        min-height: 170px;
        border-radius: 12px;
        background: #fff8e6;
        padding: 14px;
        color: #333;
        display: grid;
        place-items: center;
        align-content: center;
      }

      .omikuji-stage {
        height: 88px;
        display: none;
        place-items: center;
        margin-bottom: 8px;
      }

      .result.is-animating .omikuji-stage {
        display: grid;
      }

      .omikuji-box {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        background: linear-gradient(145deg, #da3f3f 0%, #b82424 100%);
        position: relative;
      }

      .result.is-animating .omikuji-box {
        animation: shake 0.42s ease-in-out 3;
      }

      .omikuji-stick {
        position: absolute;
        left: 50%;
        top: 18px;
        width: 6px;
        height: 50px;
        border-radius: 4px;
        background: #f3e6c7;
        transform: translate(-50%, 0);
      }

      .result.is-animating .omikuji-stick {
        animation: draw-stick 1.26s ease-out forwards;
      }

      .hint {
        margin: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes shake {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-8deg);
        }
        75% {
          transform: rotate(8deg);
        }
      }

      @keyframes draw-stick {
        0%,
        25% {
          transform: translate(-50%, 0);
        }
        70%,
        100% {
          transform: translate(-50%, -40px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .result.is-animating .omikuji-box,
        .result.is-animating .omikuji-stick {
          animation: none;
        }
      }

      .fortune {
        font-size: 1.4rem;
        font-weight: 800;
        margin: 0;
      }

      .advice {
        margin: 8px 0 0;
        font-size: 0.98rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>今日のおみくじ</h1>
      <button id="drawButton" type="button">おみくじを引く</button>
      <section class="result" id="result">
        <div class="omikuji-stage" aria-hidden="true">
          <div class="omikuji-box">
            <span class="omikuji-stick"></span>
          </div>
        </div>
        <div id="resultContent">
          <p class="hint" id="resultHint">ボタンを押して運勢を占ってみましょう。</p>
        </div>
        <p class="sr-only" id="resultMessage" aria-live="polite" aria-atomic="true"></p>
      </section>
    </main>

    <script>
      const fortunes = [
        { title: "大吉", advice: "最高の1日になるでしょう。自信を持って進みましょう。" },
        { title: "中吉", advice: "落ち着いて行動すると良い流れをつかめます。" },
        { title: "小吉", advice: "小さなチャンスを大切にすると運気が上向きます。" },
        { title: "凶", advice: "無理をせず、丁寧に過ごすことで道が開けます。" },
      ];

      const drawButton = document.getElementById("drawButton");
      const result = document.getElementById("result");
      const resultContent = document.getElementById("resultContent");
      const resultHint = document.getElementById("resultHint");
      const resultMessage = document.getElementById("resultMessage");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const fortuneText = document.createElement("p");
      const adviceText = document.createElement("p");
      let isAnimating = false;
      let revealTimerId = null;

      fortuneText.className = "fortune";
      adviceText.className = "advice";
      fortuneText.setAttribute("tabindex", "-1");

      drawButton.addEventListener("click", () => {
        if (isAnimating) {
          return;
        }

        isAnimating = true;
        drawButton.disabled = true;

        const pick = fortunes[Math.floor(Math.random() * fortunes.length)];
        result.classList.add("is-animating");
        resultHint.textContent = "おみくじを振っています…";
        resultMessage.textContent = "おみくじを振っています…";
        resultContent.replaceChildren(resultHint);

        const revealDelay = prefersReducedMotion.matches ? 0 : 1400;
        if (revealTimerId !== null) {
          window.clearTimeout(revealTimerId);
        }

        revealTimerId = window.setTimeout(() => {
          result.classList.remove("is-animating");
          resultMessage.textContent = `結果：${pick.title}。${pick.advice}`;
          fortuneText.textContent = pick.title;
          adviceText.textContent = `${pick.title}：${pick.advice}`;
          resultContent.replaceChildren(fortuneText, adviceText);
          if (prefersReducedMotion.matches && document.activeElement === drawButton) {
            fortuneText.focus({ preventScroll: true });
          }
          drawButton.disabled = false;
          isAnimating = false;
          revealTimerId = null;
        }, revealDelay);
      });

      window.addEventListener("beforeunload", () => {
        if (revealTimerId !== null) {
          window.clearTimeout(revealTimerId);
        }
      });
    </script>
  </body>
</html>
