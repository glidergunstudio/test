<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: linear-gradient(160deg, #fffaf0 0%, #ffe9e0 100%);
        padding: 16px;
      }

      .card {
        width: min(92vw, 420px);
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        padding: 24px 20px;
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        color: #333;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
        background: #ff6b6b;
        cursor: pointer;
      }

      button:active {
        transform: translateY(1px);
      }

      .result {
        margin-top: 18px;
        min-height: 88px;
        border-radius: 12px;
        background: #fff8e6;
        padding: 14px;
        color: #333;
        display: grid;
        place-items: center;
      }

      .fortune {
        font-size: 1.4rem;
        font-weight: 800;
        margin: 0;
      }

      .advice {
        margin: 8px 0 0;
        font-size: 0.98rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>今日のおみくじ</h1>
      <button id="drawButton" type="button">おみくじを引く</button>
      <section class="result" id="result" aria-live="polite">
        <p>ボタンを押して運勢を占ってみましょう。</p>
      </section>
    </main>

    <script>
      const fortunes = [
        { title: "大吉", advice: "最高の1日になるでしょう。自信を持って進みましょう。" },
        { title: "中吉", advice: "落ち着いて行動すると良い流れをつかめます。" },
        { title: "小吉", advice: "小さなチャンスを大切にすると運気が上向きます。" },
        { title: "凶", advice: "無理をせず、丁寧に過ごすことで道が開けます。" },
      ];

      const drawButton = document.getElementById("drawButton");
      const result = document.getElementById("result");

      drawButton.addEventListener("click", () => {
        const pick = fortunes[Math.floor(Math.random() * fortunes.length)];
        result.innerHTML = `
          <p class="fortune">${pick.title}</p>
          <p class="advice">${pick.title}：${pick.advice}</p>
        `;
      });
    </script>
  </body>
</html>
